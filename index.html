<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Album Story Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<header>
  <div>
    <div class="logo">STORY MAKER</div>
    <div class="logo-sub">Generador de historias de álbumes</div>
  </div>
  <div class="header-right">
    <span class="theme-pill">COLOR</span>
    <button class="color-btn active" data-color="gold"   style="background:linear-gradient(135deg,#e2b84a,#c49a1a)" title="Dorado"   onclick="setColor(this)"></button>
    <button class="color-btn"        data-color="red"    style="background:linear-gradient(135deg,#e04040,#c63528)" title="Rojo"     onclick="setColor(this)"></button>
    <button class="color-btn"        data-color="blue"   style="background:linear-gradient(135deg,#4b9fff,#1a6fd4)" title="Azul"     onclick="setColor(this)"></button>
    <button class="color-btn"        data-color="green"  style="background:linear-gradient(135deg,#5acc7e,#2a8a4a)" title="Verde"    onclick="setColor(this)"></button>
    <button class="color-btn"        data-color="purple" style="background:linear-gradient(135deg,#b06ef5,#7c3aed)" title="Morado"   onclick="setColor(this)"></button>

    <div class="picker-wrap">
      <button class="picker-btn" id="picker-btn" title="Color personalizado" onclick="openPicker(event)">
        <input type="color" id="color-input" value="#e2b84a" oninput="onColorInput(this.value)" onchange="onColorInput(this.value)">
      </button>
      <div class="hex-input-wrap" id="hex-wrap">
        <span class="hex-prefix">#</span>
        <input class="hex-input" id="hex-input" type="text" maxlength="6" placeholder="e2b84a"
               oninput="onHexType(this.value)" spellcheck="false">
      </div>
    </div>
    <div class="vsep"></div>
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="dark"  onclick="setMode(this)">🌙 Oscuro</button>
      <button class="mode-btn"        data-mode="light" onclick="setMode(this)">☀️ Claro</button>
    </div>
  </div>
</header>

<div class="tab-bar" id="tab-bar">
  <button class="tab-btn active" data-tab="editor"  onclick="switchTab(this)">✏️ Editar</button>
  <button class="tab-btn"        data-tab="preview" onclick="switchTab(this)">👁 Vista previa</button>
</div>

<div class="app">
  <div class="editor">

    <div class="section-label">Portada</div>
    <div class="cover-drop" id="cover-drop"
         onclick="document.getElementById('file-in').click()"
         ondragover="onDragOver(event)" ondragleave="onDragLeave()" ondrop="onDrop(event)">
      <img class="preview-img" id="editor-cover-img" src="" alt="">
      <div class="upload-hint" id="upload-hint">
        <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1M12 12V4m0 0-3 3m3-3 3 3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Arrastra o haz clic<br>para subir portada</span>
      </div>
    </div>
    <input type="file" id="file-in" accept="image/*" style="display:none" onchange="handleFile(this)">

    <div class="section-label">Información</div>
    <div>
      <label>Artista / Banda</label>
      <input type="text" id="i-artist" placeholder="ej. Radiohead" oninput="sync()">
    </div>
    <div>
      <label>Nombre del álbum</label>
      <input type="text" id="i-album" placeholder="ej. OK Computer" oninput="sync()">
    </div>
    <div class="two-col">
      <div><label>Año</label><input type="text" id="i-year" placeholder="1997" oninput="sync()"></div>
      <div><label>Género</label><input type="text" id="i-genre" placeholder="Alt. Rock" oninput="sync()"></div>
    </div>

    <div class="section-label">Calificación</div>
    <div class="rating-row" id="rating-row"></div>
    <div class="custom-rating-row">
      <span>Decimal:</span>
      <input type="text" id="i-custom" placeholder="8.4" oninput="customRating(this.value)">
      <span>/ 10</span>
    </div>

    <div class="section-label">Canciones favoritas</div>
    <div class="tracks-list" id="tracks-list"></div>
    <button class="btn-add" id="btn-add-track" onclick="addTrack()">+ Agregar canción</button>

    <div class="section-label">Link</div>
    <div>
      <label>Spotify, Apple Music…</label>
      <input type="text" id="i-link" placeholder="open.spotify.com/album/..." oninput="sync()">
    </div>

    <button class="export-btn" id="export-btn" onclick="exportStory()">⬇ EXPORTAR HISTORIA</button>
  </div>

  <div class="preview-panel">
    <div class="preview-badge">Vista previa · 1080 × 1920</div>
    <div class="story-wrapper">
      <div id="story-template" data-color="gold" data-mode="dark">
        <div id="t-bg"></div>
        <div id="t-cover">
          <img id="t-cover-img" src="" alt="">
          <div id="t-cover-placeholder"><span>PORTADA</span></div>
          <div class="t-grad-bottom"></div>
          <div class="t-grad-top"></div>
        </div>
        <div id="t-content">
          <div class="t-top-block">
            <div class="t-eyebrow">Mis favoritas</div>
            <div class="t-artist" id="t-artist">Artista</div>
            <div class="t-album"  id="t-album">Álbum</div>
            <div class="t-meta-row">
              <span id="t-year">—</span>
              <div class="t-meta-dot"></div>
              <span id="t-genre-tag">Género</span>
            </div>
          </div>
          <div class="t-divider"></div>
          <div class="t-bottom">
            <div class="t-score-block">
              <div class="t-score" id="t-score">—</div>
              <div class="t-score-sub">PUNTUACIÓN</div>
            </div>
            <div class="t-tracks-block">
              <div class="t-tracks-header">Top tracks</div>
              <div id="t-tracks-list"></div>
              <div class="t-link" id="t-link"></div>
            </div>
          </div>
        </div>
        <div id="t-grain"></div>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
